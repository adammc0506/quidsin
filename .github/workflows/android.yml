name: Deploy to Cloudflare and build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Add these under Settings > Secrets and variables > Actions.
      # Without them, nothing is deployed and the APK runs in on-device demo mode.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and test
        run: |
          npm ci
          npx vitest run
          npx tsc -p worker/tsconfig.json

      - name: Check Cloudflare access
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # Failures are reported as annotations so they show without opening the log.
          if ! npx wrangler whoami > who.log 2>&1; then
            echo "::error title=Cloudflare login failed::$(tail -c 1500 who.log | tr '\n' ' ')"; exit 1
          fi
          echo "::notice title=Cloudflare access::$(sed 's/\x1b\[[0-9;]*m//g' who.log | grep -iE 'account|d1|workers|scope|permission' | tr '\n' ' ' | tail -c 1500)"

      - name: Apply database migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if ! npx wrangler d1 migrations apply quidsin --remote > mig.log 2>&1; then
            echo "::error title=D1 migrations failed::$(tail -c 1500 mig.log | tr '\n' ' ')"; exit 1
          fi
          cat mig.log

      - name: Deploy website and API
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          VITE_API_URL: /
        run: |
          npm run build
          if ! npx wrangler deploy > deploy.log 2>&1; then
            echo "::error title=Deploy failed::$(tail -c 1500 deploy.log | tr '\n' ' ')"; exit 1
          fi
          cat deploy.log
          echo "::notice title=Deployed::$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### QuidsIn is live at $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Connect tabandtally.co.uk
        id: domain
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.deploy.outcome == 'success'
        run: |
          # Never fails the build: the workers.dev address keeps working if this can't attach.
          if npx wrangler deploy --domain tabandtally.co.uk --domain www.tabandtally.co.uk > domain.log 2>&1; then
            cat domain.log
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Custom domain::tabandtally.co.uk and www are attached"
            echo "### Live at https://tabandtally.co.uk" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Custom domain not attached::$(sed 's/\x1b\[[0-9;]*m//g' domain.log | tail -c 1500 | tr '\n' ' ')"
          fi

      - name: Build web app for Android
        env:
          VITE_API_URL: ${{ steps.deploy.outputs.url }}
          VITE_PUBLIC_URL: ${{ steps.domain.outputs.ok == 'true' && 'https://tabandtally.co.uk/quidsin' || (steps.deploy.outputs.url && format('{0}/quidsin', steps.deploy.outputs.url) || '') }}
        run: npm run build:app

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: QuidsIn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
