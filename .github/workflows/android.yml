name: Deploy to Cloudflare and build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Add these under Settings > Secrets and variables > Actions.
      # Without them, nothing is deployed and the APK runs in on-device demo mode.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and test
        run: |
          npm ci
          npx vitest run
          npx tsc -p worker/tsconfig.json

      - name: Create or find the D1 database
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="quidsin");process.stdout.write(d?d.uuid:"")')
          if [ -z "$id" ]; then
            npx wrangler d1 create quidsin --location weur
            id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));process.stdout.write(l.find(x=>x.name==="quidsin").uuid)')
          fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          echo "D1 database: $id"

      - name: Apply database migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply quidsin --remote

      - name: Deploy website and API
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          VITE_API_URL: /
        run: |
          npm run build
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### QuidsIn is live at $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Build web app for Android
        env:
          VITE_API_URL: ${{ steps.deploy.outputs.url }}
          VITE_PUBLIC_URL: ${{ steps.deploy.outputs.url }}
        run: npm run build

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: QuidsIn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
