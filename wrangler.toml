# QuidsIn on Cloudflare: one Worker serves the web app (./dist) and the /api routes.
name = "quidsin"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
# Keep the workers.dev address on: the Android app talks to it, and it is the fallback for the custom domain.
workers_dev = true
preview_urls = false

# Daily clean-up of expired groups (03:17 UTC).
[triggers]
crons = ["17 3 * * *"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "quidsin"
# Created 22 Nov 2026 (Western Europe). The workflow also looks it up by name.
database_id = "1fd71259-ac30-4b39-afd0-107594e6a6ae"
migrations_dir = "migrations"

# Secret Santa has its own database, so it can't crowd out QuidsIn.
[[d1_databases]]
binding = "SANTA"
database_name = "santa"
# Created 22 Nov 2026 (Western Europe).
database_id = "c19c7ffa-70d2-49b9-832a-7dd4bf50d368"
migrations_dir = "migrations-santa"
